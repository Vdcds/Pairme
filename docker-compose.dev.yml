services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pairme-dev-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pairme?schema=public
      - NODE_ENV=development
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_GET_STREAM_API_KEY=${NEXT_PUBLIC_GET_STREAM_API_KEY}
      - GET_STREAM_SECRET_KEY=${GET_STREAM_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: pairme-dev-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pairme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
